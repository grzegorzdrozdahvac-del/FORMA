name: Android

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Stamp build number into the app
        run: sed -i "s/__APK_BUILD__/${{ github.run_number }}/g" app/src/main/assets/www/index.html

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk forma-${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk forma.apk

      - name: Remove old APKs from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view android-latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset android-latest "$a" --repo "$GITHUB_REPOSITORY" -y || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: forma-${{ github.run_number }}
          path: forma-${{ github.run_number }}.apk

      - name: Publish to GitHub Release (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Forma (Android) – najnowsza wersja
          prerelease: true
          overwrite_files: true
          files: |
            forma.apk
            forma-${{ github.run_number }}.apk
